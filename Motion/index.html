<!doctype html>
<html lang="en" data-composition-variables='[{"id":"departure","type":"boolean","label":"Cat leaving","default":false}]'>
<head>
<meta charset="utf-8">
<script src="assets/gsap.min.js"></script>
<style>
  html, body { margin: 0; background: transparent; }
  #cat-notice { width: 256px; height: 256px; position: relative; overflow: hidden; }
  .clip { position: absolute; inset: 0; }
  .tile { position: absolute; inset: 20px; border-radius: 48px; overflow: hidden; background: #c8e2bd; }
  svg, canvas { position: absolute; width: 256px; height: 256px; left: -20px; top: -20px; }
  canvas { transform-origin: 52% 65%; }
</style>
</head>
<body>
<div id="cat-notice" data-composition-id="cat-notice" data-width="256" data-height="256"
     data-start="0" data-duration="2" data-fps="30">
  <div id="artwork" class="clip tile" data-start="0" data-duration="2" data-track-index="0" data-layout-allow-overflow data-layout-allow-overlap>
      <svg viewBox="0 0 256 256" aria-hidden="true">
        <g transform="rotate(-7 128 180)">
          <rect x="42" y="156" width="175" height="54" rx="13" fill="#9fb28e"/>
          <rect x="42" y="148" width="175" height="54" rx="13" fill="#f8f2df"/>
          <g fill="#5d765d">
            <rect x="53" y="158" width="19" height="10" rx="3"/>
            <rect x="79" y="158" width="19" height="10" rx="3"/>
            <rect x="105" y="158" width="19" height="10" rx="3"/>
            <rect x="131" y="158" width="19" height="10" rx="3"/>
            <rect x="157" y="158" width="19" height="10" rx="3"/>
            <rect x="183" y="158" width="21" height="10" rx="3"/>
            <rect x="55" y="177" width="20" height="10" rx="3"/>
            <rect x="83" y="177" width="91" height="10" rx="3"/>
            <rect x="182" y="177" width="21" height="10" rx="3"/>
          </g>
        </g>
      </svg>
      <canvas id="cat" width="256" height="256" aria-hidden="true"></canvas>
  </div>
</div>
<script>
  const cat = document.querySelector("#cat");
  const artwork = new Image();
  artwork.src = "assets/cat.png";
  artwork.onload = () => {
    const context = cat.getContext("2d");
    context.drawImage(artwork, 0, 0, 256, 256);
    const pixels = context.getImageData(0, 0, 256, 256);
    for (let y = 0; y < 256; y++) {
      for (let x = 0; x < 256; x++) {
        const i = (y * 256 + x) * 4;
        const green = pixels.data[i + 1];
        const face = x >= 137 && x <= 198 && y >= 86 && y <= 109;
        // Keep the original eyes, nose and leg detail with the silhouette.
        const silhouette = green < 83 || (x > 108 && x < 124 && y > 129 && y < 161 && green < 140);
        if (y > 171 || (!face && !silhouette)) pixels.data[i + 3] = 0;
      }
    }
    context.putImageData(pixels, 0, 0);
  };

  const departure = window.__hyperframes?.getVariables()?.departure === true;
  const timeline = gsap.timeline({ paused: true, defaults: { overwrite: "auto" } });
  if (departure) {
    timeline.set(cat, { x: 0, y: 0, rotate: 0 })
      .to(cat, { y: 4, scaleY: 0.94, rotate: 5, duration: 0.25, ease: "power2.inOut" }, 0.27)
      .to(cat, { x: 57, y: -36, scaleY: 1.05, rotate: -9, duration: 0.34, ease: "power2.out" }, 0.52)
      .to(cat, { x: 227, y: -4, scaleY: 1, rotate: 10, duration: 0.54, ease: "power2.in" }, 0.86);
  } else {
    timeline.set(cat, { x: -201, y: -2, rotate: 9 })
      .to(cat, { x: -67, y: -39, rotate: -9, duration: 0.50, ease: "power2.out" }, 0.14)
      .to(cat, { x: 1, y: 5, scaleY: 0.94, rotate: 3, duration: 0.37, ease: "power2.in" }, 0.64)
      .to(cat, { x: 0, y: 0, scaleY: 1, rotate: 0, duration: 0.27, ease: "power2.out" }, 1.01);
  }
  timeline.set({}, {}, 2);
  window.__timelines = window.__timelines || {};
  window.__timelines["cat-notice"] = timeline;
</script>
</body>
</html>
